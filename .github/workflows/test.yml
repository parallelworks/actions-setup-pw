name: Test Action

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Parallel Works CLI
        uses: ./
        with:
          version: latest

      - name: Verify CLI is installed
        run: |
          pw --version"
          which pw || where pw
        shell: bash

      - name: Test CLI help
        run: pw --help
        shell: bash
